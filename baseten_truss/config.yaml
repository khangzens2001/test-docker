model_name: vggt-1b-baseten
#wbEwmdel.4Z2wKP3zOjM2pOcq9i95VqMTpzp6ukFk
base_image:
  image: khangzens/vggt-1b:latest

docker_server:
  no_build: true
  start_command: "bash -c 'for f in /secrets/*; do [ -f \"$f\" ] && export \"$(basename \"$f\")\"=\"$(cat \"$f\")\"; done && python -m uvicorn backend_api_extended_manhattan:app --host 0.0.0.0 --port 8000'"
  server_port: 8000
  predict_endpoint: /predict_zip_url
  readiness_endpoint: /health
  liveness_endpoint: /health

resources:
  cpu: "4"
  memory: 16Gi
  accelerator: A10G

secrets:
  DOCKER_REGISTRY_index.docker.io: null
  R2_ACCOUNT_ID: null
  R2_ACCESS_KEY_ID: null
  R2_SECRET_ACCESS_KEY: null
  R2_BUCKET: null
